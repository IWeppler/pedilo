# API de Pedilo en Fly.io (ADR 0024). Los secretos van con `fly secrets set`, nunca acá.
app = "pedilo"
primary_region = "gru"

[build]
  dockerfile = "services/api/Dockerfile"

[deploy]
  # Las migraciones corren antes de cada versión; si fallan, no se publica.
  release_command = "node --import tsx src/db/migrate.ts"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  MEDIA_STORAGE = "supabase"
  TRUST_PROXY_HOPS = "1"
  DB_POOL_MAX = "5"
  API_PUBLIC_URL = "https://pedilo.fly.dev"

[http_service]
  internal_port = 4000
  force_https = true
  # Siempre prendida: los workers (vencimientos, push, reembolsos…) corren en el proceso.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
